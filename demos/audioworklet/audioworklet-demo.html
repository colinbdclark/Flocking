<html>
    <head>
        <title>Flocking AudioWorklet Demo</title>
        <script src="../../node_modules/infusion/dist/infusion-all.js"></script>
        <script src="../../src/core.js"></script>
    </head>

    <body>
        <button>Play</button>
    </body>

    <script>
        let button = document.querySelector("button");
        let ctx = new flock.shim.AudioContext();
        let p = ctx.audioWorklet.addModule(
            "../../dist/flocking-audioworklet.js");
        let isPlaying = false;
        let flockingNode;
        p.then(function () {
            flockingNode = new AudioWorkletNode(ctx,
            "FlockingProcessor");
            flockingNode.port.postMessage({
                graphs: {
                    root: {
                        ugen: "flock.ugen.sinOsc",
                        freq: 440,
                        mul: 0.1
                    },

                    third: {
                        ugen: "flock.ugen.sinOsc",
                        freq: 220 * 5/4,
                        mul: 0.1
                    },

                    fifth: {
                        ugen: "flock.ugen.sinOsc",
                        freq: 220 * 3/2,
                        mul: 0.1
                    }
                }
            });
            flockingNode.connect(ctx.destination);
        });

        function play() {
            isPlaying = true;
            button.innerText = "Pause";
            ctx.resume();
        }

        function pause() {
            isPlaying = false;
            button.innerText = "Play";
            ctx.suspend();
        }

        button.onclick = function (evt) {
            if (!isPlaying) {
                play();
            } else {
                pause();
            }
        };
    </script>
</html>
